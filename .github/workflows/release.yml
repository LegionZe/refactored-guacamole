name: Release

# Builds module.zip and publishes a GitHub release whenever main is updated and
# module.json carries a version that has not been released yet.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Read version
        id: version
        run: |
          VERSION=$(jq -r .version module.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build module.zip
        if: steps.version.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          jq --arg v "$VERSION" --arg r "$REPO" \
            '.version = $v
             | .manifest = "https://github.com/\($r)/releases/latest/download/module.json"
             | .download = "https://github.com/\($r)/releases/download/v\($v)/module.zip"' \
            module.json > module.json.tmp && mv module.json.tmp module.json
          zip -r module.zip module.json scripts lib lang LICENSE README.md

      - name: Create release
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: |
            module.json
            module.zip
